    <ul class="c-header--list">

      <li class="c-header--list_item">

    <a  class="c-header--logo" href="#">
      <img src="../../assets/appicons/favicon.svg" alt="">
    </a>

    <ul class="c-header--list">
      <li class="c-header--list_item">

      </li>

      <li class="c-header--list_item">

      </li>

    <div class="c-header--actions">
      <a href="" class="c-btn">Test</a>
      <a href="" class="c-btn">Test</a>
    </div>
  </section>



  <p style="margin: 60px 0">Header avec logo au milieu</p>

  <section class="c-header c-header--icon-center">

    <ul class="c-header--list">
      <li class="c-header--list_item">
        <a href="#">Lien</a>
      </li>
      <li class="c-header--list_item">
        <a href="#">Lien</a>
      </li>

      <li class="c-header--list_item-logo">

      <li class="c-header--list_item">

      </li>
